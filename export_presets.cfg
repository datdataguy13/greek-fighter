; Build targets. tools/export.sh builds them all (and so does the GitHub
; workflow in .github/workflows/build.yml). Output goes to build/.

[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, icon.png"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
; Single-threaded, so it runs on any static host (GitHub Pages, itch.io)
; without special server headers.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/mac/Greek Fighter.zip"

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="io.github.datdataguy13.greekfighter"
application/short_version="1.0"
application/version="1.0"
application/copyright="Thomas Matthews"
application/min_macos_version_arm64="11.00"
application/min_macos_version_x86_64="10.13"
; Ad-hoc signed. Not notarized, so macOS asks once before opening it.
codesign/codesign=1
notarization/notarization=0

[preset.2]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/linux/greek-fighter.x86_64"

[preset.2.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.3]

name="Raspberry Pi 64-bit"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/pi/greek-fighter.arm64"

[preset.3.options]

binary_format/embed_pck=true
binary_format/architecture="arm64"

[preset.4]

name="Raspberry Pi 32-bit"
platform="Linux"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*"
export_path="build/pi/greek-fighter.arm32"

[preset.4.options]

binary_format/embed_pck=true
binary_format/architecture="arm32"
